<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel & Restaurant Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    <h1 class="text-3xl font-bold text-gray-800 border-b pb-4">Hotel & Restaurant Management System</h1>

    <!-- 1. ROOM STATUS GRID -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-blue-700">Room Management</h2>
      <button onclick="fetchRooms()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mb-4">Refresh Rooms</button>
      <div id="rooms-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- 2. INTERACTIVE RESTAURANT POS & CART -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-green-700">Restaurant POS Order System</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Menu Items List -->
        <div class="md:col-span-2">
          <h3 class="font-bold text-gray-700 mb-2">Available Menu Items (Click to Add)</h3>
          <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>
        
        <!-- Cart Sidebar -->
        <div class="bg-gray-50 p-4 rounded-lg border">
          <h3 class="font-bold text-gray-800 border-b pb-2 mb-3">Order Cart</h3>
          <div id="cart-items" class="space-y-2 text-sm max-h-48 overflow-y-auto mb-4">
            <p class="text-gray-400 italic">No items added yet.</p>
          </div>
          <div class="border-t pt-2 space-y-2">
            <div class="flex justify-between font-bold text-gray-800">
              <span>Total:</span>
              <span id="cart-total">$0.00</span>
            </div>
            <input id="pos_customer_id" type="number" placeholder="Customer ID (Optional)" class="w-full border p-2 rounded text-sm">
            <input id="pos_room_id" type="number" placeholder="Room ID (Optional)" class="w-full border p-2 rounded text-sm">
            <input id="pos_staff_id" type="number" placeholder="Staff ID (e.g. 1)" class="w-full border p-2 rounded text-sm" value="1">
            <button onclick="submitPosOrder()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 font-semibold">Submit POS Order</button>
            <p id="pos-msg" class="text-xs font-bold mt-1"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. UNIFIED BILLING CALCULATOR -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-purple-700">Guest Billing Summary</h2>
      <div class="flex gap-4 mb-4">
        <input id="customerIdInput" type="number" placeholder="Enter Customer ID (e.g. 1)" class="border p-2 rounded w-64">
        <button onclick="fetchCheckoutBill()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Calculate Bill</button>
      </div>
      <div id="bill-result" class="text-gray-700 font-mono space-y-2"></div>
    </div>

    <!-- 4. GUEST CHECK-OUT & SETTLEMENT -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-red-700">Guest Check-Out & Settlement</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
        <input id="co_customer_id" type="number" placeholder="Customer ID" class="border p-2 rounded">
        <input id="co_booking_id" type="number" placeholder="Booking ID" class="border p-2 rounded">
        <input id="co_amount" type="number" step="0.01" placeholder="Amount Paid" class="border p-2 rounded">
        <select id="co_method" class="border p-2 rounded">
          <option value="cash">Cash</option>
          <option value="credit_card">Credit Card</option>
          <option value="room_charge">Room Charge</option>
        </select>
      </div>
      <button onclick="processCheckout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Process Check-Out</button>
      <p id="checkout-message" class="mt-2 text-sm font-bold"></p>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let cart = [];

    async function fetchRooms() {
      try {
        const res = await fetch(`${API_URL}/rooms`);
        const rooms = await res.json();
        const container = document.getElementById('rooms-grid');
        container.innerHTML = rooms.map(r => `
          <div class="border p-4 rounded-lg ${
            r.status === 'available' ? 'bg-green-50 border-green-300' :
            r.status === 'cleaning' ? 'bg-yellow-50 border-yellow-300' : 'bg-red-50 border-red-300'
          }">
            <p class="font-bold text-lg">Room ${r.room_number}</p>
            <p class="text-sm text-gray-600">Type: ${r.room_type}</p>
            <p class="text-sm text-gray-600">Price: $${r.price_per_night}/night</p>
            <span class="inline-block mt-2 text-xs font-bold px-2 py-1 rounded uppercase ${
              r.status === 'available' ? 'bg-green-200 text-green-800' :
              r.status === 'cleaning' ? 'bg-yellow-200 text-yellow-800' : 'bg-red-200 text-red-800'
            }">${r.status}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading rooms:', err);
      }
    }

    async function fetchMenu() {
      try {
        const res = await fetch(`${API_URL}/menu`);
        const items = await res.json();
        const container = document.getElementById('menu-grid');
        container.innerHTML = items.map(m => `
          <div onclick="addToCart(${m.item_id}, '${m.name}', ${m.price})" class="border p-3 rounded-lg bg-gray-50 hover:bg-green-50 cursor-pointer border-gray-200 hover:border-green-400 transition">
            <p class="font-bold text-sm">${m.name}</p>
            <p class="text-xs text-gray-500">${m.category}</p>
            <p class="text-sm font-semibold text-green-600">$${m.price}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading menu:', err);
      }
    }

    function addToCart(id, name, price) {
      const existing = cart.find(item => item.menu_item_id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ menu_item_id: id, name, unit_price: parseFloat(price), quantity: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = '<p class="text-gray-400 italic">No items added yet.</p>';
        document.getElementById('cart-total').innerText = '$0.00';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, index) => {
        const subtotal = item.unit_price * item.quantity;
        total += subtotal;
        return `
          <div class="flex justify-between items-center bg-white p-2 rounded border">
            <div>
              <p class="font-bold">${item.name}</p>
              <p class="text-xs text-gray-500">$${item.unit_price} x ${item.quantity}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-green-600">$${subtotal.toFixed(2)}</span>
              <button onclick="removeFromCart(${index})" class="text-red-500 text-xs font-bold px-1">✕</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    async function submitPosOrder() {
      const msg = document.getElementById('pos-msg');
      if (cart.length === 0) {
        msg.className = "text-xs font-bold text-red-600 mt-1";
        msg.innerText = "Cart is empty.";
        return;
      }

      const payload = {
        customer_id: parseInt(document.getElementById('pos_customer_id').value) || null,
        room_id: parseInt(document.getElementById('pos_room_id').value) || null,
        staff_id: parseInt(document.getElementById('pos_staff_id').value) || 1,
        items: cart
      };

      try {
        const res = await fetch(`${API_URL}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          msg.className = "text-xs font-bold text-green-600 mt-1";
          msg.innerText = `Order #${data.order_id} created successfully!`;
          cart = [];
          renderCart();
        } else {
          msg.className = "text-xs font-bold text-red-600 mt-1";
          msg.innerText = data.error || "Order submission failed.";
        }
      } catch (err) {
        msg.className = "text-xs font-bold text-red-600 mt-1";
        msg.innerText = "Server connection error.";
      }
    }

    async function fetchCheckoutBill() {
      const customerId = document.getElementById('customerIdInput').value || 1;
      try {
        const res = await fetch(`${API_URL}/checkout/${customerId}`);
        const data = await res.json();
        
        document.getElementById('co_customer_id').value = data.customer_id;
        document.getElementById('co_amount').value = data.grand_total.toFixed(2);

        document.getElementById('bill-result').innerHTML = `
          <p>Customer ID: <strong>${data.customer_id}</strong></p>
          <p>Room Stay Subtotal: $${data.room_total.toFixed(2)}</p>
          <p>Dining Subtotal: $${data.dining_total.toFixed(2)}</p>
          <hr class="my-2">
          <p class="text-lg font-bold text-black">Grand Total Due: $${data.grand_total.toFixed(2)}</p>
        `;
      } catch (err) {
        console.error('Error fetching bill:', err);
      }
    }

    async function processCheckout() {
      const customer_id = parseInt(document.getElementById('co_customer_id').value);
      const booking_id = parseInt(document.getElementById('co_booking_id').value);
      const amount_paid = parseFloat(document.getElementById('co_amount').value);
      const payment_method = document.getElementById('co_method').value;

      const msgEl = document.getElementById('checkout-message');

      if (!customer_id || !booking_id || isNaN(amount_paid)) {
        msgEl.className = "mt-2 text-sm font-bold text-red-600";
        msgEl.innerText = "Please fill in Customer ID, Booking ID, and Amount Paid.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_id, booking_id, amount_paid, payment_method })
        });

        const data = await res.json();

        if (res.ok) {
          msgEl.className = "mt-2 text-sm font-bold text-green-600";
          msgEl.innerText = data.message;
          fetchRooms();
        } else {
          msgEl.className = "mt-2 text-sm font-bold text-red-600";
          msgEl.innerText = data.error || 'Check-out failed.';
        }
      } catch (err) {
        msgEl.className = "mt-2 text-sm font-bold text-red-600";
        msgEl.innerText = 'Server error during check-out.';
      }
    }

    fetchRooms();
    fetchMenu();
  </script>
</body>
</html>
